# Builds wineless_libretro.so on branchd, as .github/workflows/build.yml does on GitHub, and on
# main publishes it as this repository's generic package `wineless`:
#   registry.branchd.run/generic/pixelstream/wineless/wineless/<short sha>/wineless_libretro.so
# with `latest` moved to it. emulation-cores' cores/wineless_libretro.so is updated from there.
name: ci
'on':
  push: {}
  pull_request: {}
  manual: {}
jobs:
  build:
    # 22.04 on purpose, as on GitHub: everything but glibc is static, and building against glibc
    # 2.35 keeps the core loadable by older node images.
    image: ubuntu:22.04
    timeout: 2h
    resources:
      cpu: 8
      memory: 12Gi
    checkout:
      depth: 1
    # The dependency build (glslang, SDL3, ogg/vorbis, DXVK) is slow and fully pinned by the
    # script and patches; bump the key when either changes.
    cache:
      key: deps-ubuntu2204-dxvk2.7.1-sdl3.4.8-v1
      paths:
      - deps
    steps:
    - run: |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          ca-certificates build-essential gcc-12 g++-12 cmake ninja-build \
          python3 python3-venv python3-pip pkg-config git \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
          libxfixes-dev libxss-dev libxkbcommon-dev \
          libwayland-dev libwayland-bin wayland-protocols \
          libgl-dev libegl-dev libasound2-dev libpulse-dev \
          libdbus-1-dev libudev-dev libdrm-dev libgbm-dev
        # glslang needs CMake >= 3.27 and 22.04 ships 3.22; GitHub's runner image has a newer
        # one preinstalled, which is why the workflow there never needed this.
        python3 -m pip install -q 'cmake>=3.27,<4'
        hash -r
        cmake --version | head -1
        export CC=gcc-12 CXX=g++-12 JOBS=8
        scripts/build-deps.sh
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
        ninja -C build
        mkdir -p dist
        cp build/wineless_libretro.so dist/wineless_libretro.so
        strip dist/wineless_libretro.so
        ls -la dist/wineless_libretro.so
        sha256sum dist/wineless_libretro.so
    artifacts:
      paths:
      - dist/wineless_libretro.so
      expire-in: 2 weeks
  # Not gated on `protected`, unlike the other cores: this repository's main has no branch rule,
  # because it is synced from GitHub by hand and a rule would refuse that push.
  publish-core:
    if: (event == 'push' || event == 'manual') && branch == 'main' && !merge_queue
    needs:
    - build
    image: alpine:3.24
    permissions:
      packages: write
    steps:
    - run: test -s dist/wineless_libretro.so && sha256sum dist/wineless_libretro.so
    - uses: branchd/steps/package-publish@v1
      isolated: true
      workspace: [dist/wineless_libretro.so]
      with:
        package: wineless
        version: $CI_COMMIT_SHORT_SHA
        files: [dist/wineless_libretro.so]
        aliases: [latest]
        if_exists: keep
